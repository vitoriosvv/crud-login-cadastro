<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/x-icon" href="img/icons/iconLogin.svg">
    <script src="../js/index.js" defer></script>
    <title>InovaTech</title>
</head>

<body>
    <main class="conect-container">
        <div class="descript-content">
            <img src="img/icons/iconTechInova.svg" class="iconTechInova" alt="Logo InovaTech">
            <h1>InovaTech</h1>
            <h2>Login</h2>
            <a href="pages/cadastro.html">
                Não possuo cadastro ainda
            </a>
        </div>
        <div class="form-content">
            <form action="#" id="loginForm">
                <div class="user-content">
                    <label for="useremail">Email:</label>
                    <input type="email" class="useremail" name="useremail" required placeholder="seuemail@gmail.com">
                </div>
                <div class="pass-content">
                    <label for="password">Senha:</label>
                    <span class="campo-senha">
                        <input type="password" id="password" name="password" required placeholder="Digite sua senha">
                        <button type="button" class="mostrar-senha" data-alvo="password" aria-label="Mostrar senha" aria-pressed="false"></button>
                    </span>
                </div>
                <button type="submit" id="btnEntrar">Entrar</button>
            </form>
        </div>
    </main>
</body>

</html>
